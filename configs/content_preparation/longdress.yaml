# Full Longdress preparation: 300 frames (1051–1350), Q0–Q3, progressive Draco.
# This config is intentionally not run during migration/setup. Run the two-frame
# native pilot and review its resource report before explicitly starting this job.
version: 1
output: output/content_preparation/longdress_full
delivery_modes: [progressive]
objects:
  - id: longdress
    dataset:
      kind: raw
      raw_template: output/datasets/8i/longdress/Ply/longdress_vox10_{frame:04d}.ply
      train_poses: third_party/dynamic-lapis-gs/transforms_train.json
      test_poses: third_party/dynamic-lapis-gs/transforms_test.json
      width: 1024
    frames: {start: 1051, end: 1350, step: 1}
    fps: 30
    qualities:
      - {id: Q0, resolution_scale: 8}
      - {id: Q1, resolution_scale: 4}
      - {id: Q2, resolution_scale: 2}
      - {id: Q3, resolution_scale: 1}
training:
  backend: upstream
  initial_iterations: 30000
  dynamic_iterations: 30000
  lambda_dssim: 0.8
  sh_degree: 3
  extra_args: ["-r", "1"]
encoding:
  name: gaussian_attribute_draco_byteplanes
  precision: f32
  executable: output/build/content_preparation/draco_byte_codec
  encoder_speed: 3
  decoder_speed: 3
packaging:
  gof_frames: 180
  segment_frames: 15
  refresh_frames: {Base: 90, E1: 60, E2: 30, E3: 15}
sampling:
  azimuth: [-180, -135, -90, -45, 0, 45, 90, 135]
  elevation: [-20, 0, 20]
  scales: [0.5, 1.0, 1.5]
  distance: 4.0311287
  times: [1051, 1066, 1081, 1096, 1111, 1126, 1141, 1156, 1171, 1186, 1201,
          1216, 1231, 1246, 1261, 1276, 1291, 1306, 1321, 1336, 1350]
renderer:
  backend: upstream_cuda
  up_axis: z
  width: 1024
  height: 1024
  fov_degrees: 39.5978
  center: [0, 0, -0.1]
  background: [0, 0, 0]
metrics:
  lpips: true
  lpips_net: vgg
  device: cpu
  batch_size: 1
  distortion: mse
proxy:
  enabled: false
  external_descriptor: null
runtime:
  seed: 0
  gpu_batch_size: 1
  extension_path: null

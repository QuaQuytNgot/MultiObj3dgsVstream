[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiobj3dgs"
version = "0.1.0"
description = "Multi-object dynamic Gaussian DASH streaming and native playback"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
network = ["curl_cffi==0.16.3"]
content = ["numpy>=1.26,<2", "PyYAML>=6", "Pillow>=10"]
streamstgs = ["torch>=1.13", "numpy>=1.26,<2", "imagecodecs", "plyfile", "PyYAML>=6"]
native = ["cuda-python>=11.8,<13", "rich>=12", "glfw>=2.7,<3", "imgui>=2.0,<3", "PyOpenGL>=3.1.7", "PyGLM>=2.7"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "numpy>=1.26,<2"]

[tool.setuptools.packages.find]
where = ["src_final"]

[tool.setuptools.package-data]
multiobj3dgs = ["**/*.xsd", "**/*.json", "**/*.xml", "**/MPEG-LICENSE", "**/README.md", "**/*.cpp", "**/*.hpp"]
